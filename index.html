
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Studio</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    background: linear-gradient(135deg, #090014, #1b0638, #080018);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

.container {
    width: 90%;
    max-width: 440px;
    padding: 30px;
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 25px;
    background: rgba(255,255,255,0.07);
    backdrop-filter: blur(20px);
    box-shadow: 0 0 50px rgba(139, 0, 255, 0.2);
    text-align: center;
}

h1 {
    font-size: 32px;
    margin-bottom: 8px;
    background: linear-gradient(90deg, #d8aaff, #9c5cff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.subtitle {
    color: #bba8d3;
    margin-bottom: 25px;
    font-size: 14px;
}

input, select {
    width: 100%;
    padding: 15px;
    margin: 10px 0;
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 12px;
    background: rgba(0,0,0,0.3);
    color: white;
    outline: none;
}

select option {
    background: #1b0638;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 12px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(90deg, #8e36ff, #bd65ff);
    color: white;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 20px rgba(170, 70, 255, 0.4);
}

#qrContainer {
    margin: 25px auto;
    padding: 15px;
    background: white;
    width: fit-content;
    border-radius: 12px;
    display: none;
}

#qrContainer img {
    display: block;
}

.error {
    color: #ff7777;
    font-size: 13px;
    margin-top: 10px;
}

#menuOverlay {
    position: fixed;
    inset: 0;
    z-index: 10;
    background: linear-gradient(135deg, #090014, #200644, #080018);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 25px;
}

.menuContent {
    width: 100%;
    max-width: 420px;
    text-align: center;
}

.menuContent h1 {
    font-size: 38px;
    margin-bottom: 12px;
}

.menuContent p {
    color: #c5afd9;
    margin-bottom: 30px;
    line-height: 1.5;
}

#closeMenu {
    background: transparent;
    border: 1px solid rgba(255,255,255,0.25);
    margin-top: 12px;
}

.hidden {
    display: none !important;
}

#generatorSection.hidden,
#resultSection.hidden {
    display: none;
}
</style>
</head>

<body>

<div id="menuOverlay">
    <div class="menuContent">
        <h1>QR STUDIO</h1>
        <p>Create clean, stylish website QR codes in seconds.</p>
        <button onclick="closeMenu()">CREATE QR CODE</button>
    </div>
</div>

<div class="container">

    <div id="generatorSection">
        <h1>QR STUDIO</h1>
        <p class="subtitle">Turn your website into a QR code.</p>

        <input type="url" id="websiteInput" placeholder="Enter your website URL">

        <select id="qrSize">
            <option value="180">Small</option>
            <option value="240" selected>Medium</option>
            <option value="320">Large</option>
            <option value="400">Extra Large</option>
        </select>

        <button onclick="generateQR()">GENERATE QR CODE</button>
        <p class="error" id="errorMessage"></p>
    </div>

    <div id="resultSection" class="hidden">
        <h1>YOUR QR CODE</h1>

        <div id="qrContainer">
            <div id="qrcode"></div>
        </div>

        <button onclick="shareQR()">SHARE QR CODE</button>
    </div>

    <button onclick="openMenu()">MENU</button>
</div>

<script>
let qrCodeInstance = null;

function closeMenu() {
    document.getElementById("menuOverlay").classList.add("hidden");
}

function openMenu() {
    document.getElementById("menuOverlay").classList.remove("hidden");
}

function generateQR() {
    const input = document.getElementById("websiteInput");
    const error = document.getElementById("errorMessage");
    const qrContainer = document.getElementById("qrContainer");
    const qrElement = document.getElementById("qrcode");

    const url = input.value.trim();
    const size = Number(document.getElementById("qrSize").value);

    error.textContent = "";
    qrElement.innerHTML = "";
    qrContainer.style.display = "none";

    if (!url) {
        error.textContent = "Please enter a website URL.";
        return;
    }

    let validUrl;

    try {
        validUrl = new URL(
            /^[a-zA-Z][a-zA-Z\d+.-]*:/.test(url)
                ? url
                : "https://" + url
        );

        if (!["http:", "https:"].includes(validUrl.protocol)) {
            throw new Error("Invalid website");
        }
    } catch {
        error.textContent = "Please enter a valid website URL.";
        return;
    }

    qrCodeInstance = new QRCode(qrElement, {
        text: validUrl.href,
        width: size,
        height: size,
        colorDark: "#000000",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.H
    });

    qrContainer.style.display = "block";

    document.getElementById("generatorSection").classList.add("hidden");
    document.getElementById("resultSection").classList.remove("hidden");
}

async function shareQR() {
    const qrImage = document.querySelector("#qrcode img");

    if (!qrImage) {
        alert("Please generate a QR code first.");
        return;
    }

    try {
        const response = await fetch(qrImage.src);
        const blob = await response.blob();
        const file = new File([blob], "website-qr.png", {
            type: "image/png"
        });

        if (navigator.canShare && navigator.canShare({ files: [file] })) {
            await navigator.share({
                title: "My Website QR Code",
                files: [file]
            });
        } else if (navigator.share) {
            await navigator.share({
                title: "My Website QR Code",
                text: document.getElementById("websiteInput").value
            });
        } else {
            alert("Sharing is not supported on this device.");
        }
    } catch (error) {
        if (error.name !== "AbortError") {
            alert("Unable to share the QR code on this device.");
        }
    }
}
</script>

</body>
</html>
